<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5d83">
<title>Nasza randka ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#321d25}
body{overflow-x:hidden;background:linear-gradient(160deg,#fff8fa,#ffe3eb 55%,#ffd2df)}
body:before{content:"";position:fixed;inset:-30%;z-index:-2;background:radial-gradient(circle at 20% 20%,#fff 0 8%,transparent 24%),radial-gradient(circle at 85% 75%,#ff91aa55,transparent 28%);filter:blur(10px)}
.wrap{width:min(620px,92vw);margin:auto;padding:22px 0 35px}.screen{display:none}.screen.active{display:block;animation:up .55s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.top{text-align:center;padding:25px 10px 20px}.miniheart{font-size:48px;animation:beat 1.5s infinite}
@keyframes beat{50%{transform:scale(1.13)}}h1{font-size:clamp(35px,10vw,54px);line-height:.98;letter-spacing:-2px;margin:12px 0}
h2{font-size:29px;letter-spacing:-.7px;margin:0 0 8px}p{font-size:17px;line-height:1.5;color:#80636c}
.card{background:#ffffffcf;border:1px solid #fff9;border-radius:30px;padding:22px;box-shadow:0 20px 55px #8b31401b;backdrop-filter:blur(16px)}
.btn{border:0;width:100%;padding:17px;border-radius:19px;background:linear-gradient(135deg,#ff4f78,#ff7e9c);color:#fff;font-size:17px;font-weight:850;box-shadow:0 14px 28px #ff4f7838;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.97)}.ghost{background:#fff;color:#e04469;box-shadow:none;border:1px solid #ffd1db;margin-top:10px}
.progress{height:6px;background:#ffffffaa;border-radius:10px;overflow:hidden;margin:4px 0 22px}.progress i{display:block;height:100%;width:50%;background:#ff547b;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}
.option{position:relative;overflow:hidden;border:2px solid transparent;background:#fff;border-radius:23px;min-height:122px;padding:17px 10px;cursor:pointer;transition:.22s;box-shadow:0 9px 24px #74314012}
.option:active{transform:scale(.96)}.option.selected{border-color:#ff547b;background:#fff0f4;transform:translateY(-3px);box-shadow:0 12px 28px #ff547b25}
.option .e{font-size:39px;display:block;margin-bottom:8px}.option b{font-size:14px}
.option:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;background:#ff547b12;right:-35px;bottom:-35px}
.deck{position:relative;height:390px;margin:18px 0}.deck .option{position:absolute;inset:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.deck .option:nth-child(n+2){transform:scale(.94) translateY(12px);opacity:.55}.deck .option:nth-child(n+3){transform:scale(.88) translateY(25px);opacity:.25}
.swipehint{text-align:center;font-size:13px;color:#a27c87;margin:8px}
.result{text-align:center;padding:15px 5px 5px}.resultIcon{font-size:78px;animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
.result h2{font-size:39px;margin:10px 0 4px}.result .big{font-size:20px;font-weight:800;color:#633c48}
.badge{display:inline-block;background:#fff0f4;color:#d33d60;border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.conf{position:absolute;top:-20px;font-size:20px;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}
.small{font-size:12px!important;color:#a1848c!important}
@media(max-width:430px){.deck{height:350px}.option{min-height:108px}.grid{gap:8px}}
</style>
</head>
<body>
<div id="confetti"></div><main class="wrap">

<section id="s0" class="screen active">
 <div class="top"><div class="miniheart">❤️</div><h1>Mam dla Ciebie<br>małą niespodziankę</h1><p>Wybierzmy razem naszą następną randkę.<br>Gotowa? 😏</p></div>
 <div class="card"><button class="btn" onclick="go(1)">Sprawdźmy ✨</button></div>
</section>

<section id="s1" class="screen">
 <div class="progress"><i></i></div><div class="card">
 <h2>Co robimy? ❤️</h2><p>Wybierz jedną opcję albo zdaj się na los.</p>
 <div class="grid" id="grid"></div>
 <button class="btn" id="choose" disabled onclick="choose()">To wybieram ❤️</button>
 </div>
</section>

<section id="s2" class="screen">
 <div class="progress"><i style="width:100%"></i></div><div class="card result">
 <div class="resultIcon" id="ri">❤️</div><span class="badge">NASZA RANDKA</span>
 <h2 id="rt"></h2><div class="big" id="rb"></div>
 <p>Brzmi jak plan. Teraz tylko trzeba ustalić termin. 🥰</p>
 <button class="btn" onclick="randomAgain()">Daj jeszcze jedną szansę 🎲</button>
 <button class="btn ghost" onclick="restart()">Wybierzmy od początku</button>
 <p class="small">PS. Z Tobą każda opcja brzmi dobrze ❤️</p>
 </div>
</section>
</main>

<script>
const opts=[
["Restauracja","🍽️","idziemy coś dobrego zjeść"],
["Góry","🏔️","ruszamy razem w góry"],
["Spacer","🚶","idziemy na wspólny spacer"],
["Kino","🎬","idziemy razem do kina"],
["Serial","📺","robimy wieczór z serialem"],
["Wspólne gotowanie","👨‍🍳","gotujemy coś razem"],
["Zdaj się na los","🎲","los wybiera za nas"]
];
let sel=null, busy=false;
function go(n){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById("s"+n).classList.add("active");scrollTo(0,0)}
function render(){
 const g=document.getElementById("grid");g.innerHTML="";
 opts.forEach((o,i)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<span class="e">${o[1]}</span><b>${o[0]}</b>`;b.onclick=()=>select(i,b);g.appendChild(b)})
}
function select(i,b){if(busy)return;sel=i;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");document.getElementById("choose").disabled=false}
function choose(){
 if(sel===null||busy)return;
 if(sel===6){busy=true;let cards=[...document.querySelectorAll(".option")],n=0;
  let timer=setInterval(()=>{cards.forEach(x=>x.classList.remove("selected"));cards[Math.floor(Math.random()*6)].classList.add("selected");n++;
   if(n>15){clearInterval(timer);let r=Math.floor(Math.random()*6);show(r)}
  },85);
 }else show(sel)
}
function show(i){busy=false;document.getElementById("ri").textContent=opts[i][1];document.getElementById("rt").textContent=opts[i][0];document.getElementById("rb").textContent=opts[i][2];go(2);confetti()}
function randomAgain(){show(Math.floor(Math.random()*6))}
function restart(){sel=null;document.getElementById("choose").disabled=true;render();go(1)}
function confetti(){
 const box=document.getElementById("confetti");box.innerHTML="";
 const chars=["❤️","💕","✨","💗","💖","🌸"];
 for(let i=0;i<45;i++){let s=document.createElement("span");s.className="conf";s.textContent=chars[Math.floor(Math.random()*chars.length)];s.style.left=Math.random()*100+"vw";s.style.setProperty("--x",(Math.random()*220-110)+"px");s.style.animationDuration=(2+Math.random()*2)+"s";s.style.animationDelay=Math.random()*.35+"s";box.appendChild(s)}
 setTimeout(()=>box.innerHTML="",5000)
}
render();
</script>
</body></html>
